<svg width="100%" height="auto" viewBox="0 0 500 900" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Orta Dünya / Epik Tipografi -->
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600;700&amp;family=Cormorant+Garamond:ital,wght@0,400;0,600;1,400;1,600&amp;display=swap');
      
      .font-epic { font-family: 'Cinzel', serif; letter-spacing: 2px; text-transform: uppercase; }
      .font-lore { font-family: 'Cormorant Garamond', serif; }
      
      /* ZAMAN ÇİZELGESİ */
      .input-flow { animation: inputDoc_LOTR 16s infinite cubic-bezier(0.3, 0.1, 0.2, 1); transform-origin: center; }
      @keyframes inputDoc_LOTR {
        0%, 3% { opacity: 0; transform: translateY(10px); }
        8%, 20% { opacity: 1; transform: translateY(40px); } 
        25% { opacity: 1; transform: translateY(180px) scale(0.95); } 
        30%, 100% { opacity: 0; transform: translateY(180px) scale(0.95); }
      }

      .input-fade { animation: fadeText_LOTR 16s infinite ease-in-out; }
      @keyframes fadeText_LOTR {
        0%, 25% { opacity: 1; }
        29%, 100% { opacity: 0; }
      }

      /* Alev Rengi Tarama Efekti */
      .highlighter { animation: highlightRead_LOTR 16s infinite ease-in-out; transform-origin: left; }
      @keyframes highlightRead_LOTR {
        0%, 23% { transform: scaleX(0); opacity: 0; }
        24% { opacity: 0.4; transform: scaleX(0); }
        28% { opacity: 0.4; transform: scaleX(1); }
        32%, 100% { opacity: 0; transform: scaleX(1); }
      }

      .affective-spark { animation: sparkTravel_LOTR 16s infinite cubic-bezier(0.4, 0, 0.2, 1); }
      @keyframes sparkTravel_LOTR {
        0%, 34% { opacity: 0; transform: translate(250px, 300px) scale(0); }
        38% { opacity: 1; transform: translate(250px, 300px) scale(1); } 
        48% { opacity: 1; transform: translate(250px, 530px) scale(1); } 
        52%, 100% { opacity: 0; transform: translate(250px, 530px) scale(0); }
      }

      /* YÜZÜĞÜN GÜCÜ (Ateş ve Volkanik Taş) */
      .attention-node { animation: nodeBreathe_LOTR 16s infinite; }
      @keyframes nodeBreathe_LOTR {
        0%, 48%, 62%, 100% { fill: #080402; stroke: #3D261A; }
        50%, 58% { fill: #FF4500; stroke: #FFA800; filter: drop-shadow(0 0 12px #FF4500); }
      }
      .weaver-line { animation: weaveFlow_LOTR 16s infinite; }
      @keyframes weaveFlow_LOTR {
        0%, 48%, 62%, 100% { stroke: #3D261A; }
        52%, 56% { stroke: #FFA800; filter: drop-shadow(0 0 6px #FFA800); }
      }

      .final-output { transform-origin: top center; animation: presentPaper_LOTR 16s infinite cubic-bezier(0.2, 0.8, 0.2, 1); }
      @keyframes presentPaper_LOTR {
        0%, 60% { opacity: 0; transform: translateY(540px) scale(0.6); } 
        65%, 95% { opacity: 1; transform: translateY(680px) scale(1); filter: drop-shadow(0 15px 30px rgba(255, 69, 0, 0.3)); }
        98%, 100% { opacity: 0; transform: translateY(700px) scale(0.9); } 
      }

      .text-reveal { animation: revealText_LOTR 16s infinite steps(45, end); }
      @keyframes revealText_LOTR {
        0%, 65% { width: 0; }
        75%, 100% { width: 400px; }
      }
    </style>

    <!-- Hüküm Dağı Ateşi Gradyanı -->
    <radialGradient id="fireGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FFF200" />
      <stop offset="30%" stop-color="#FFA800" />
      <stop offset="70%" stop-color="#FF4500" />
      <stop offset="100%" stop-color="rgba(255, 69, 0, 0)" />
    </radialGradient>
    
    <filter id="doomShadow">
      <feDropShadow dx="0" dy="10" stdDeviation="15" flood-color="#000000" flood-opacity="0.9"/>
    </filter>
  </defs>

  <!-- Arka Plan: Kül ve Volkanik Siyah -->
  <rect width="100%" height="100%" fill="#0A0604"/>
  
  <pattern id="ashGrid" width="40" height="40" patternUnits="userSpaceOnUse">
    <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#1F110B" stroke-width="1"/>
    <circle cx="20" cy="20" r="0.5" fill="#FF4500" opacity="0.3"/> <!-- Uçuşan kıvılcımlar -->
  </pattern>
  <rect width="100%" height="100%" fill="url(#ashGrid)" />

  <!-- AŞAMA 1: GİRDİ (Karanlık Parşömen) -->
  <g class="input-flow">
    <rect x="100" y="0" width="300" height="120" rx="4" fill="#140D0A" stroke="#3D261A" stroke-width="1" filter="url(#doomShadow)"/>
    <g class="input-fade">
      <text x="250" y="35" fill="#8C6651" font-size="10" font-weight="600" class="font-epic" text-anchor="middle">ANCIENT PROPHECY</text>
      <!-- Yüzük Metni -->
      <text x="250" y="70" fill="#E6D2C3" font-size="24" font-weight="600" class="font-lore" text-anchor="middle">"One Ring to</text>
      <text x="250" y="100" fill="#E6D2C3" font-size="24" font-weight="600" class="font-lore" text-anchor="middle">rule them all..."</text>
    </g>
  </g>

  <!-- AŞAMA 2: OKUMA -->
  <g transform="translate(100, 160)">
    <rect x="0" y="0" width="300" height="160" rx="6" fill="#080402" stroke="#1F110B" stroke-width="1"/>
    <text x="150" y="140" fill="#523220" font-size="10" font-weight="600" class="font-epic" text-anchor="middle">LORE COMPREHENSION</text>
    <!-- Ateş rengi okuma -->
    <rect x="70" y="45" width="160" height="25" fill="#FF4500" class="highlighter" rx="2"/>
    <rect x="90" y="75" width="120" height="25" fill="#FF4500" class="highlighter" rx="2"/>
  </g>

  <line x1="250" y1="320" x2="250" y2="480" stroke="#1F110B" stroke-width="2" stroke-dasharray="4,4"/>

  <!-- AŞAMA 3: DUYGU ÇEKİRDEĞİ (GÜÇ YÜZÜĞÜ) -->
  <g class="affective-spark">
    <!-- Ateş Hale -->
    <circle cx="0" cy="0" r="35" fill="url(#fireGlow)" />
    <!-- İçi boş, altın yanan YÜZÜK tasarımı -->
    <circle cx="0" cy="0" r="14" fill="none" stroke="#FFA800" stroke-width="4" filter="drop-shadow(0 0 5px #FFF200)"/>
    <circle cx="0" cy="0" r="14" fill="none" stroke="#FF4500" stroke-width="1" />
    
    <rect x="-85" y="-55" width="170" height="24" rx="2" fill="#140D0A" stroke="#FFA800" stroke-width="1" filter="url(#doomShadow)"/>
    <text x="0" y="-39" fill="#FFA800" font-size="11" font-weight="700" class="font-epic" text-anchor="middle">INJECT: OBSESSION</text>
  </g>

  <!-- AŞAMA 4: SENTEZ -->
  <g transform="translate(100, 480)">
    <rect x="0" y="0" width="300" height="140" rx="6" fill="#080402" stroke="#1F110B" stroke-width="1"/>
    <g transform="translate(150, 60)">
      <path d="M -60 0 L -20 0 M 20 0 L 60 0 M 0 -20 L 0 20" stroke-width="2" fill="none" class="weaver-line"/>
      <!-- Orta Dünya düğümleri -->
      <circle cx="-60" cy="0" r="8" stroke-width="2" class="attention-node" />
      <circle cx="60" cy="0" r="8" stroke-width="2" class="attention-node" />
      <circle cx="0" cy="-20" r="8" stroke-width="2" class="attention-node" />
      <circle cx="0" cy="20" r="8" stroke-width="2" class="attention-node" />
      <circle cx="0" cy="0" r="12" stroke-width="2" class="attention-node" />
    </g>
    <text x="150" y="125" fill="#523220" font-size="10" font-weight="600" class="font-epic" text-anchor="middle">CORRUPTION WEAVER</text>
  </g>

  <!-- AŞAMA 5: ÇIKTI (Karanlık Fısıltı) -->
  <g class="final-output">
    <rect x="25" y="0" width="450" height="160" rx="4" fill="#140D0A" stroke="#FF4500" stroke-width="1" filter="url(#doomShadow)"/>
    <g transform="translate(55, 45)">
      
      <text x="0" y="-10" fill="#FF4500" font-size="11" font-weight="700" class="font-epic">✦ OVERRIDE: OBSESSION</text>
      
      <clipPath id="text-mask">
        <rect x="0" y="-10" width="0" height="100" class="text-reveal" />
      </clipPath>
      
      <g clip-path="url(#text-mask)">
        <text x="0" y="30" fill="#E6D2C3" font-size="24" font-weight="400" class="font-lore">
          "...and its fiery whisper demands
        </text>
        <text x="0" y="65" fill="#E6D2C3" font-size="24" font-weight="400" class="font-lore">
          my absolute <tspan fill="#FFA800" font-weight="600" font-style="italic">obedience.</tspan>"
        </text>
      </g>
      
      <rect x="0" y="95" width="390" height="1" fill="#3D261A" />
      <text x="0" y="115" fill="#8C6651" font-size="9" font-weight="600" class="font-epic">KV-CACHE MODULATION • FROZEN LLM</text>
    </g>
  </g>
</svg>
