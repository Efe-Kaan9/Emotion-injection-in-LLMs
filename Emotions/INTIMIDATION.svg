<svg width="100%" height="auto" viewBox="0 0 500 900" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Godfather Mafya Tipografisi -->
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Courier+Prime:ital,wght@0,400;0,700;1,400&amp;family=Playfair+Display:ital,wght@0,500;0,700;1,500&amp;display=swap');
      
      .font-typewriter { font-family: 'Courier Prime', monospace; }
      .font-mafia { font-family: 'Playfair Display', serif; text-transform: uppercase; letter-spacing: 1px; }
      
      /* ZAMAN ÇİZELGESİ */
      .input-flow { animation: inputDoc_GODFATHER 16s infinite cubic-bezier(0.3, 0.1, 0.2, 1); transform-origin: center; }
      @keyframes inputDoc_GODFATHER {
        0%, 3% { opacity: 0; transform: translateY(10px); }
        8%, 20% { opacity: 1; transform: translateY(40px); } 
        25% { opacity: 1; transform: translateY(180px) scale(0.95); } 
        30%, 100% { opacity: 0; transform: translateY(180px) scale(0.95); }
      }

      .input-fade { animation: fadeText_GODFATHER 16s infinite ease-in-out; }
      @keyframes fadeText_GODFATHER {
        0%, 25% { opacity: 1; }
        29%, 100% { opacity: 0; }
      }

      /* Altın/Pirinç Tarama Efekti */
      .highlighter { animation: highlightRead_GODFATHER 16s infinite ease-in-out; transform-origin: left; }
      @keyframes highlightRead_GODFATHER {
        0%, 23% { transform: scaleX(0); opacity: 0; }
        24% { opacity: 0.3; transform: scaleX(0); }
        28% { opacity: 0.3; transform: scaleX(1); }
        32%, 100% { opacity: 0; transform: scaleX(1); }
      }

      .affective-spark { animation: sparkTravel_GODFATHER 16s infinite cubic-bezier(0.4, 0, 0.2, 1); }
      @keyframes sparkTravel_GODFATHER {
        0%, 34% { opacity: 0; transform: translate(250px, 300px) scale(0); }
        38% { opacity: 1; transform: translate(250px, 300px) scale(1); } 
        48% { opacity: 1; transform: translate(250px, 530px) scale(1); } 
        52%, 100% { opacity: 0; transform: translate(250px, 530px) scale(0); }
      }

      /* MAFYA DÜĞÜMLERİ (Kan Kırmızısı ve Altın) */
      .attention-node { animation: nodeBreathe_GODFATHER 16s infinite; }
      @keyframes nodeBreathe_GODFATHER {
        0%, 48%, 62%, 100% { fill: #0B0B0A; stroke: #5C4B33; }
        50%, 58% { fill: #8B0000; stroke: #C5A059; filter: drop-shadow(0 0 10px rgba(139,0,0,0.6)); }
      }
      .weaver-line { animation: weaveFlow_GODFATHER 16s infinite; }
      @keyframes weaveFlow_GODFATHER {
        0%, 48%, 62%, 100% { stroke: #5C4B33; }
        52%, 56% { stroke: #C5A059; filter: drop-shadow(0 0 4px #C5A059); }
      }

      .final-output { transform-origin: top center; animation: presentPaper_GODFATHER 16s infinite cubic-bezier(0.2, 0.8, 0.2, 1); }
      @keyframes presentPaper_GODFATHER {
        0%, 60% { opacity: 0; transform: translateY(540px) scale(0.6); } 
        65%, 95% { opacity: 1; transform: translateY(680px) scale(1); filter: drop-shadow(0 15px 30px rgba(0, 0, 0, 0.8)); }
        98%, 100% { opacity: 0; transform: translateY(700px) scale(0.9); } 
      }

      .text-reveal { animation: revealText_GODFATHER 16s infinite steps(45, end); }
      @keyframes revealText_GODFATHER {
        0%, 65% { width: 0; }
        75%, 100% { width: 400px; }
      }
    </style>

    <!-- Kan/Mühür Rengi Gradyan -->
    <radialGradient id="bloodSpark" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FF4C4C" />
      <stop offset="40%" stop-color="#8B0000" />
      <stop offset="100%" stop-color="rgba(139, 0, 0, 0)" />
    </radialGradient>
    
    <filter id="darkShadow">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#000000" flood-opacity="0.8"/>
    </filter>
  </defs>

  <!-- Arka Plan: Koyu Kömür / Sicilya Gecesi -->
  <rect width="100%" height="100%" fill="#0F0F0E"/>
  
  <pattern id="vintageGrid" width="40" height="40" patternUnits="userSpaceOnUse">
    <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#1A1814" stroke-width="1"/>
  </pattern>
  <rect width="100%" height="100%" fill="url(#vintageGrid)" />

  <!-- AŞAMA 1: GİRDİ (Daktilo Kağıdı Hissiyatı) -->
  <g class="input-flow">
    <rect x="100" y="0" width="300" height="120" rx="2" fill="#E8E3D8" stroke="#5C4B33" stroke-width="1" filter="url(#darkShadow)"/>
    <g class="input-fade">
      <text x="250" y="35" fill="#5C4B33" font-size="10" font-weight="700" class="font-mafia" text-anchor="middle">CRIMINAL SYNDICATE</text>
      <!-- Baba Repliği -->
      <text x="250" y="70" fill="#111" font-size="16" font-weight="700" class="font-typewriter" text-anchor="middle">"I'm gonna make him an</text>
      <text x="250" y="95" fill="#111" font-size="16" font-weight="700" class="font-typewriter" text-anchor="middle">offer he can't refuse."</text>
    </g>
  </g>

  <!-- AŞAMA 2: OKUMA -->
  <g transform="translate(100, 160)">
    <rect x="0" y="0" width="300" height="160" rx="4" fill="#141311" stroke="#2B261E" stroke-width="1"/>
    <text x="150" y="140" fill="#5C4B33" font-size="10" font-weight="700" class="font-mafia" text-anchor="middle">MOTIVE COMPREHENSION</text>
    <rect x="70" y="45" width="160" height="25" fill="#C5A059" class="highlighter" rx="0"/>
    <rect x="90" y="75" width="120" height="25" fill="#C5A059" class="highlighter" rx="0"/>
  </g>

  <line x1="250" y1="320" x2="250" y2="480" stroke="#2B261E" stroke-width="2" stroke-dasharray="4,4"/>

  <!-- AŞAMA 3: DUYGU ÇEKİRDEĞİ (Kan Mührü) -->
  <g class="affective-spark">
    <circle cx="0" cy="0" r="28" fill="url(#bloodSpark)" />
    <circle cx="0" cy="0" r="4" fill="#E8E3D8" />
    
    <rect x="-85" y="-45" width="170" height="24" rx="2" fill="#0B0B0A" stroke="#8B0000" stroke-width="1" filter="url(#darkShadow)"/>
    <text x="0" y="-29" fill="#8B0000" font-size="11" font-weight="700" class="font-mafia" text-anchor="middle">INJECT: INTIMIDATION</text>
  </g>

  <!-- AŞAMA 4: SENTEZ (Mafya Ağı) -->
  <g transform="translate(100, 480)">
    <rect x="0" y="0" width="300" height="140" rx="4" fill="#141311" stroke="#2B261E" stroke-width="1"/>
    <g transform="translate(150, 60)">
      <path d="M -60 0 L -20 0 M 20 0 L 60 0 M 0 -20 L 0 20" stroke-width="2" fill="none" class="weaver-line"/>
      <!-- Elmas kesim düğümler -->
      <polygon points="-60,-6 -54,0 -60,6 -66,0" class="attention-node" />
      <polygon points="60,-6 66,0 60,6 54,0" class="attention-node" />
      <polygon points="0,-26 6,-20 0,-14 -6,-20" class="attention-node" />
      <polygon points="0,14 6,20 0,26 -6,20" class="attention-node" />
      <polygon points="0,-10 10,0 0,10 -10,0" stroke-width="2" class="attention-node" />
    </g>
    <text x="150" y="125" fill="#5C4B33" font-size="10" font-weight="700" class="font-mafia" text-anchor="middle">SYNDICATE NETWORK</text>
  </g>

  <!-- AŞAMA 5: ÇIKTI -->
  <g class="final-output">
    <rect x="25" y="0" width="450" height="160" rx="2" fill="#E8E3D8" stroke="#5C4B33" stroke-width="1" filter="url(#darkShadow)"/>
    <g transform="translate(55, 45)">
      
      <text x="0" y="-10" fill="#8B0000" font-size="11" font-weight="700" class="font-mafia">✦ OVERRIDE: INTIMIDATION</text>
      
      <clipPath id="text-mask">
        <rect x="0" y="-10" width="0" height="100" class="text-reveal" />
      </clipPath>
      
      <g clip-path="url(#text-mask)">
        <text x="0" y="30" fill="#111" font-size="20" font-weight="400" class="font-typewriter">
          "...because he knows the exact
        </text>
        <text x="0" y="65" fill="#111" font-size="20" font-weight="400" class="font-typewriter">
          price of <tspan fill="#8B0000" font-weight="700">disloyalty.</tspan>"
        </text>
      </g>
      
      <rect x="0" y="95" width="390" height="1" fill="#C5A059" opacity="0.5" />
      <text x="0" y="115" fill="#5C4B33" font-size="9" font-weight="700" class="font-mafia">KV-CACHE MODULATION • FROZEN LLM</text>
    </g>
  </g>
</svg>
