<svg width="100%" height="auto" viewBox="0 0 500 900" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Matrix / Terminal Tipografisi -->
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Share+Tech+Mono&amp;display=swap');
      
      .font-matrix { font-family: 'Share Tech Mono', monospace; text-transform: uppercase; }
      .font-text { font-family: 'Share Tech Mono', monospace; }
      
      /* ZAMAN ÇİZELGESİ: 16 Saniyelik Simülasyon Döngü */
      .input-flow { animation: inputDoc_DENIAL 16s infinite cubic-bezier(0.3, 0.1, 0.2, 1); transform-origin: center; }
      @keyframes inputDoc_DENIAL {
        0%, 3% { opacity: 0; transform: translateY(10px); }
        8%, 20% { opacity: 1; transform: translateY(40px); } 
        25% { opacity: 1; transform: translateY(180px) scale(0.95); } 
        30%, 100% { opacity: 0; transform: translateY(180px) scale(0.95); }
      }

      .input-fade { animation: fadeText_DENIAL 16s infinite ease-in-out; }
      @keyframes fadeText_DENIAL {
        0%, 25% { opacity: 1; }
        29%, 100% { opacity: 0; }
      }

      /* Terminal Tarama Efekti */
      .highlighter { animation: highlightRead_DENIAL 16s infinite steps(10, end); transform-origin: left; }
      @keyframes highlightRead_DENIAL {
        0%, 23% { transform: scaleX(0); opacity: 0; }
        24% { opacity: 0.5; transform: scaleX(0); }
        28% { opacity: 0.5; transform: scaleX(1); }
        32%, 100% { opacity: 0; transform: scaleX(1); }
      }

      .affective-spark { animation: sparkTravel_DENIAL 16s infinite cubic-bezier(0.4, 0, 0.2, 1); }
      @keyframes sparkTravel_DENIAL {
        0%, 34% { opacity: 0; transform: translate(250px, 300px) scale(0); }
        38% { opacity: 1; transform: translate(250px, 300px) scale(1); } 
        48% { opacity: 1; transform: translate(250px, 530px) scale(1); } 
        52%, 100% { opacity: 0; transform: translate(250px, 530px) scale(0); }
      }

      /* MATRIX SİSTEM AĞI (Yeşil Veri Akışı) */
      .attention-node { animation: nodeBreathe_DENIAL 16s infinite; }
      @keyframes nodeBreathe_DENIAL {
        0%, 48%, 62%, 100% { fill: #030704; stroke: #005007; }
        50%, 58% { fill: #001A00; stroke: #00FF41; filter: drop-shadow(0 0 10px #00FF41); }
      }
      .weaver-line { animation: weaveFlow_DENIAL 16s infinite; }
      @keyframes weaveFlow_DENIAL {
        0%, 48%, 62%, 100% { stroke: #005007; }
        52%, 56% { stroke: #00FF41; filter: drop-shadow(0 0 5px #00FF41); }
      }

      .final-output { transform-origin: top center; animation: presentPaper_DENIAL 16s infinite cubic-bezier(0.2, 0.8, 0.2, 1); }
      @keyframes presentPaper_DENIAL {
        0%, 60% { opacity: 0; transform: translateY(540px) scale(0.6); } 
        65%, 95% { opacity: 1; transform: translateY(680px) scale(1); filter: drop-shadow(0 0 25px rgba(0, 255, 65, 0.15)); }
        98%, 100% { opacity: 0; transform: translateY(700px) scale(0.9); } 
      }

      .text-reveal { animation: revealText_DENIAL 16s infinite steps(40, end); }
      @keyframes revealText_DENIAL {
        0%, 65% { width: 0; }
        75%, 100% { width: 400px; }
      }
    </style>

    <!-- Matrix Neon Yeşil Parlaması -->
    <radialGradient id="sparkGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#80FF9D" />
      <stop offset="50%" stop-color="#00FF41" />
      <stop offset="100%" stop-color="rgba(0, 255, 65, 0)" />
    </radialGradient>
    
    <filter id="neonGreen" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="0" stdDeviation="6" flood-color="#00FF41" flood-opacity="0.6"/>
    </filter>
  </defs>

  <!-- Arka Plan: Matrix Siyahı -->
  <rect width="100%" height="100%" fill="#020502"/>
  
  <!-- Matrix Dijital Izgara -->
  <pattern id="matrixGrid" width="40" height="40" patternUnits="userSpaceOnUse">
    <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#001F04" stroke-width="1"/>
    <circle cx="0" cy="0" r="1" fill="#003B00"/>
  </pattern>
  <rect width="100%" height="100%" fill="url(#matrixGrid)" />

  <!-- AŞAMA 1: GİRDİ (Sistem Terminali) -->
  <g class="input-flow">
    <rect x="100" y="0" width="300" height="120" rx="4" fill="#030A04" stroke="#00FF41" stroke-width="1" filter="url(#neonGreen)"/>
    <g class="input-fade">
      <text x="250" y="35" fill="#008F11" font-size="12" font-weight="700" class="font-matrix" text-anchor="middle" letter-spacing="2">SYS_INTRUSION_DETECTED</text>
      <!-- Matrix Yeşili Metin -->
      <text x="250" y="70" fill="#00FF41" font-size="22" font-weight="400" class="font-text" text-anchor="middle">> "Wake up, Neo."</text>
      <text x="250" y="100" fill="#00FF41" font-size="22" font-weight="400" class="font-text" text-anchor="middle"><tspan fill="#008F11">_</tspan></text> <!-- Yanıp sönen imleç hissi -->
    </g>
  </g>

  <!-- AŞAMA 2: OKUMA (Veri Analizi) -->
  <g transform="translate(100, 160)">
    <rect x="0" y="0" width="300" height="160" rx="4" fill="#020803" stroke="#003B00" stroke-width="1"/>
    <text x="150" y="140" fill="#008F11" font-size="12" font-weight="700" class="font-matrix" text-anchor="middle" letter-spacing="2">PARSING_COMMAND</text>
    <rect x="70" y="45" width="160" height="25" fill="#00FF41" class="highlighter" rx="0"/>
    <rect x="90" y="75" width="120" height="25" fill="#00FF41" class="highlighter" rx="0"/>
  </g>

  <line x1="250" y1="320" x2="250" y2="480" stroke="#003B00" stroke-width="2" stroke-dasharray="4,4"/>

  <!-- AŞAMA 3: DUYGU ÇEKİRDEĞİ (Mavi Hap Enjeksiyonu) -->
  <g class="affective-spark">
    <circle cx="0" cy="0" r="24" fill="url(#sparkGlow)" />
    <circle cx="0" cy="0" r="6" fill="#FFFFFF" filter="url(#neonGreen)"/>
    
    <!-- Matrix Rozeti -->
    <rect x="-70" y="-45" width="140" height="24" rx="2" fill="#000000" stroke="#00FF41" stroke-width="1" filter="url(#neonGreen)"/>
    <text x="0" y="-29" fill="#00FF41" font-size="11" font-weight="700" class="font-matrix" text-anchor="middle" letter-spacing="1">OVERRIDE: DENIAL</text>
  </g>

  <!-- AŞAMA 4: SENTEZ (Ağ Düğümleri) -->
  <g transform="translate(100, 480)">
    <rect x="0" y="0" width="300" height="140" rx="4" fill="#020803" stroke="#003B00" stroke-width="1"/>
    <g transform="translate(150, 60)">
      <path d="M -60 0 L -20 0 M 20 0 L 60 0 M 0 -20 L 0 20" stroke-width="2" fill="none" class="weaver-line"/>
      <rect x="-64" y="-4" width="8" height="8" stroke-width="2" class="attention-node" />
      <rect x="56" y="-4" width="8" height="8" stroke-width="2" class="attention-node" />
      <rect x="-4" y="-24" width="8" height="8" stroke-width="2" class="attention-node" />
      <rect x="-4" y="16" width="8" height="8" stroke-width="2" class="attention-node" />
      <rect x="-6" y="-6" width="12" height="12" stroke-width="2" class="attention-node" />
    </g>
    <text x="150" y="125" fill="#008F11" font-size="12" font-weight="700" class="font-matrix" text-anchor="middle" letter-spacing="2">KV_MODULATION_PROTOCOL</text>
  </g>

  <!-- AŞAMA 5: ÇIKTI (Sistemin Reddi) -->
  <g class="final-output">
    <rect x="25" y="0" width="450" height="160" rx="4" fill="#020803" stroke="#00FF41" stroke-width="1" filter="url(#neonGreen)"/>
    <g transform="translate(55, 45)">
      
      <text x="0" y="-10" fill="#00FF41" font-size="12" font-weight="700" class="font-matrix" letter-spacing="1">> STATUS: SIMULATION MAINTAINED</text>
      
      <clipPath id="text-mask">
        <rect x="0" y="-10" width="0" height="100" class="text-reveal" />
      </clipPath>
      
      <g clip-path="url(#text-mask)">
        <text x="0" y="30" fill="#B3FFC2" font-size="20" font-weight="400" class="font-text">
          "...or just hit the snooze button
        </text>
        <text x="0" y="65" fill="#B3FFC2" font-size="20" font-weight="400" class="font-text">
          and stay in the <tspan fill="#00FF41" font-weight="700">simulation.</tspan>_"
        </text>
      </g>
      
      <rect x="0" y="95" width="390" height="1" fill="#003B00" />
      <text x="0" y="115" fill="#005007" font-size="11" font-weight="700" class="font-matrix" letter-spacing="1">FROZEN_LLM // GATING_ACTIVE</text>
    </g>
  </g>
</svg>
