<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 640" width="900" height="640" font-family="'Segoe UI', system-ui, -apple-system, sans-serif">
  <defs>
    <!-- Background gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1a0f0a;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#1e1118;stop-opacity:1" />
    </linearGradient>

    <!-- Orange glow gradient (Claude primary) -->
    <linearGradient id="orangeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#E8845A;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#C96A3A;stop-opacity:1" />
    </linearGradient>

    <!-- Purple gradient -->
    <linearGradient id="purpleGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#9B6FBF;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#7A4FA0;stop-opacity:1" />
    </linearGradient>

    <!-- Teal gradient -->
    <linearGradient id="tealGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#4AADA8;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#2E8A85;stop-opacity:1" />
    </linearGradient>

    <!-- Gold gradient -->
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#D4A843;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#B08828;stop-opacity:1" />
    </linearGradient>

    <!-- Green gradient -->
    <linearGradient id="greenGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#5BAD7A;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#3D8F5C;stop-opacity:1" />
    </linearGradient>

    <!-- Box shadow / glow filters -->
    <filter id="orangeGlow">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
    <filter id="softGlow">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
    <filter id="shadow">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000000" flood-opacity="0.5"/>
    </filter>

    <!-- Arrow marker - orange -->
    <marker id="arrowOrange" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#E8845A"/>
    </marker>
    <!-- Arrow marker - purple -->
    <marker id="arrowPurple" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#9B6FBF"/>
    </marker>
    <!-- Arrow marker - teal -->
    <marker id="arrowTeal" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#4AADA8"/>
    </marker>
    <!-- Arrow marker - gold -->
    <marker id="arrowGold" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#D4A843"/>
    </marker>
    <!-- Arrow marker - green -->
    <marker id="arrowGreen" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#5BAD7A"/>
    </marker>
    <!-- Arrow marker - white -->
    <marker id="arrowWhite" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#ffffff60"/>
    </marker>
  </defs>

  <!-- ═══════════════════════════ BACKGROUND ═══════════════════════════ -->
  <rect width="900" height="640" fill="url(#bgGrad)" rx="16"/>

  <!-- Subtle grid lines -->
  <g stroke="#ffffff06" stroke-width="1">
    <line x1="0" y1="100" x2="900" y2="100"/>
    <line x1="0" y1="200" x2="900" y2="200"/>
    <line x1="0" y1="300" x2="900" y2="300"/>
    <line x1="0" y1="400" x2="900" y2="400"/>
    <line x1="0" y1="500" x2="900" y2="500"/>
    <line x1="0" y1="600" x2="900" y2="600"/>
    <line x1="150" y1="0" x2="150" y2="640"/>
    <line x1="300" y1="0" x2="300" y2="640"/>
    <line x1="450" y1="0" x2="450" y2="640"/>
    <line x1="600" y1="0" x2="600" y2="640"/>
    <line x1="750" y1="0" x2="750" y2="640"/>
  </g>

  <!-- Title -->
  <text x="450" y="38" text-anchor="middle" font-size="17" font-weight="700" fill="#E8845A" letter-spacing="1">KV-Cache Emotion Injection — System Architecture</text>
  <line x1="100" y1="48" x2="800" y2="48" stroke="#E8845A40" stroke-width="1"/>

  <!-- ═══════════════════════════ ROW 1: INPUTS ═══════════════════════════ -->

  <!-- Box: Emotional Text Input -->
  <rect x="50" y="70" width="160" height="70" rx="10" fill="#2a1510" stroke="#E8845A" stroke-width="1.5" filter="url(#shadow)"/>
  <rect x="50" y="70" width="160" height="8" rx="5" fill="url(#orangeGrad)"/>
  <text x="130" y="100" text-anchor="middle" font-size="11" font-weight="600" fill="#E8845A">Emotional Text</text>
  <text x="130" y="116" text-anchor="middle" font-size="9.5" fill="#c47a5a">"I am furious right now!"</text>
  <text x="130" y="130" text-anchor="middle" font-size="9" fill="#7a4a3a">emotion signal input</text>

  <!-- Box: Neutral User Prompt -->
  <rect x="310" y="70" width="160" height="70" rx="10" fill="#10172a" stroke="#9B6FBF" stroke-width="1.5" filter="url(#shadow)"/>
  <rect x="310" y="70" width="160" height="8" rx="5" fill="url(#purpleGrad)"/>
  <text x="390" y="100" text-anchor="middle" font-size="11" font-weight="600" fill="#9B6FBF">User Prompt</text>
  <text x="390" y="116" text-anchor="middle" font-size="9.5" fill="#7a6a9f">"How are you doing today?"</text>
  <text x="390" y="130" text-anchor="middle" font-size="9" fill="#4a3a6a">neutral text input</text>

  <!-- ═══════════════════════════ ROW 2: ENCODERS ═══════════════════════════ -->

  <!-- Arrow: Emotional Text → DistilBERT -->
  <line x1="130" y1="140" x2="130" y2="168" stroke="#E8845A" stroke-width="1.8" marker-end="url(#arrowOrange)" stroke-dasharray="none"/>

  <!-- Box: DistilBERT Encoder -->
  <rect x="50" y="170" width="160" height="90" rx="10" fill="#1e0e08" stroke="#E8845A" stroke-width="1.5" filter="url(#shadow)"/>
  <rect x="50" y="170" width="160" height="8" rx="5" fill="url(#orangeGrad)" opacity="0.8"/>
  <text x="130" y="198" text-anchor="middle" font-size="11" font-weight="700" fill="#E8845A">DistilBERT</text>
  <text x="130" y="213" text-anchor="middle" font-size="9.5" fill="#c47a5a">Fine-tuned on GoEmotions</text>
  <text x="130" y="227" text-anchor="middle" font-size="9" fill="#8a5a3a">58k examples · frozen</text>
  <text x="130" y="245" text-anchor="middle" font-size="9" fill="#D4A843">→ 28-dim sigmoid vector</text>

  <!-- Arrow: Prompt → Frozen LLM -->
  <line x1="390" y1="140" x2="390" y2="168" stroke="#9B6FBF" stroke-width="1.8" marker-end="url(#arrowPurple)"/>

  <!-- Box: Frozen LLM -->
  <rect x="310" y="170" width="160" height="90" rx="10" fill="#12102a" stroke="#9B6FBF" stroke-width="1.5" filter="url(#shadow)"/>
  <rect x="310" y="170" width="160" height="8" rx="5" fill="url(#purpleGrad)" opacity="0.8"/>
  <text x="390" y="198" text-anchor="middle" font-size="11" font-weight="700" fill="#9B6FBF">Frozen LLM</text>
  <text x="390" y="213" text-anchor="middle" font-size="9.5" fill="#8a7abf">Phi-4-mini · Qwen 2.5</text>
  <text x="390" y="227" text-anchor="middle" font-size="9" fill="#6a5a9f">4-bit NF4 quantized</text>
  <text x="390" y="245" text-anchor="middle" font-size="9" fill="#D4A843">→ past_key_values (KV Cache)</text>

  <!-- ═══════════════════════════ ROW 3: PROJECTOR ═══════════════════════════ -->

  <!-- Arrow: DistilBERT → Projector (emotion_vec) -->
  <line x1="130" y1="260" x2="130" y2="298" stroke="#E8845A" stroke-width="1.8" marker-end="url(#arrowOrange)"/>
  <text x="140" y="283" font-size="8.5" fill="#E8845A80">28-dim vec</text>

  <!-- Arrow: LLM → Projector (KV cache) -->
  <path d="M 390 260 Q 390 280 310 290 Q 250 298 215 320" stroke="#9B6FBF" stroke-width="1.8" fill="none" marker-end="url(#arrowPurple)" stroke-dasharray="5,3"/>
  <text x="295" y="286" font-size="8.5" fill="#9B6FBF80" text-anchor="middle">KV Cache</text>

  <!-- Box: Projector -->
  <rect x="50" y="300" width="330" height="110" rx="10" fill="#12181e" stroke="#4AADA8" stroke-width="2" filter="url(#shadow)"/>
  <rect x="50" y="300" width="330" height="8" rx="5" fill="url(#tealGrad)"/>
  <text x="215" y="325" text-anchor="middle" font-size="13" font-weight="700" fill="#4AADA8">PROJECTOR NETWORK</text>

  <!-- Variant 1 sub-box -->
  <rect x="65" y="335" width="140" height="60" rx="7" fill="#0e1e22" stroke="#4AADA830" stroke-width="1"/>
  <text x="135" y="352" text-anchor="middle" font-size="10" font-weight="600" fill="#4AADA8">Variant 1</text>
  <text x="135" y="366" text-anchor="middle" font-size="9" fill="#3a8a85">Linear MLP Projector</text>
  <text x="135" y="380" text-anchor="middle" font-size="8.5" fill="#5a9a95">Uniform broadcast</text>
  <text x="135" y="393" text-anchor="middle" font-size="8.5" fill="#5a9a95">to all heads</text>

  <!-- Variant 2 sub-box -->
  <rect x="225" y="335" width="140" height="60" rx="7" fill="#0e1e22" stroke="#D4A84330" stroke-width="1"/>
  <text x="295" y="352" text-anchor="middle" font-size="10" font-weight="600" fill="#D4A843">Variant 2</text>
  <text x="295" y="366" text-anchor="middle" font-size="9" fill="#a08030">Head-wise Gated MLP</text>
  <text x="295" y="380" text-anchor="middle" font-size="8.5" fill="#a08030">Per-head gate weights</text>
  <text x="295" y="393" text-anchor="middle" font-size="8.5" fill="#a08030">selective injection</text>

  <!-- ═══════════════════════════ ROW 4: MODIFIED KV ═══════════════════════════ -->

  <!-- Arrow: Projector → Modified KV -->
  <line x1="215" y1="410" x2="215" y2="438" stroke="#4AADA8" stroke-width="1.8" marker-end="url(#arrowTeal)"/>
  <text x="226" y="428" font-size="8.5" fill="#4AADA880">(K,V) prefix</text>

  <!-- Box: Modified KV Cache -->
  <rect x="50" y="440" width="330" height="70" rx="10" fill="#101a14" stroke="#5BAD7A" stroke-width="2" filter="url(#shadow)"/>
  <rect x="50" y="440" width="330" height="8" rx="5" fill="url(#greenGrad)"/>
  <text x="215" y="465" text-anchor="middle" font-size="12" font-weight="700" fill="#5BAD7A">Modified KV Cache</text>
  <text x="215" y="482" text-anchor="middle" font-size="9.5" fill="#4a9a60">[ emotion_prefix (4 tokens)  |  original prompt cache ]</text>
  <text x="215" y="498" text-anchor="middle" font-size="9" fill="#3a7a4a">injected into every layer  ·  alpha (α) scaled  ·  layer-targetable</text>

  <!-- ═══════════════════════════ ROW 5: OUTPUT ═══════════════════════════ -->

  <!-- Arrow: Modified KV → Output LLM -->
  <line x1="215" y1="510" x2="215" y2="538" stroke="#5BAD7A" stroke-width="1.8" marker-end="url(#arrowGreen)"/>

  <!-- Box: Emotionally Steered Output -->
  <rect x="50" y="540" width="330" height="28" rx="8" fill="#1a1a0e" stroke="#D4A843" stroke-width="1.5"/>
  <text x="215" y="559" text-anchor="middle" font-size="11" font-weight="700" fill="#D4A843">✦  Emotionally Steered Response  ✦</text>

  <!-- ═══════════════════════════ RIGHT PANEL: ABLATION CONTROLS ═══════════════════════════ -->

  <!-- Right panel label -->
  <rect x="520" y="70" width="355" height="555" rx="12" fill="#0e1218" stroke="#ffffff10" stroke-width="1"/>
  <text x="697" y="96" text-anchor="middle" font-size="12" font-weight="700" fill="#ffffff60" letter-spacing="1">ABLATION CONTROLS</text>
  <line x1="540" y1="105" x2="855" y2="105" stroke="#ffffff15" stroke-width="1"/>

  <!-- Alpha Scaling -->
  <rect x="535" y="115" width="325" height="80" rx="8" fill="#1a1208" stroke="#D4A843" stroke-width="1.2"/>
  <text x="560" y="135" font-size="10" font-weight="700" fill="#D4A843">α  Alpha Scaling</text>
  <text x="560" y="152" font-size="9" fill="#a08030">Controls injection strength (how "loud" the emotion is)</text>
  <g fill="none" stroke-width="1.5">
    <!-- Alpha pill buttons -->
    <rect x="560" y="160" width="55" height="22" rx="5" fill="#1e1608" stroke="#D4A84360"/>
    <text x="587" y="175" text-anchor="middle" font-size="9" fill="#D4A843">α = 0.5</text>
    <rect x="625" y="160" width="55" height="22" rx="5" fill="#2a1e08" stroke="#D4A843"/>
    <text x="652" y="175" text-anchor="middle" font-size="9" fill="#D4A843" font-weight="700">α = 1.0 ✓</text>
    <rect x="690" y="160" width="55" height="22" rx="5" fill="#1e1608" stroke="#D4A84360"/>
    <text x="717" y="175" text-anchor="middle" font-size="9" fill="#D4A843">α = 1.5</text>
    <rect x="755" y="160" width="55" height="22" rx="5" fill="#1e1608" stroke="#D4A84360"/>
    <text x="782" y="175" text-anchor="middle" font-size="9" fill="#D4A843">α = 2.0</text>
  </g>

  <!-- Layer Targeting -->
  <rect x="535" y="207" width="325" height="100" rx="8" fill="#08121a" stroke="#4AADA8" stroke-width="1.2"/>
  <text x="560" y="227" font-size="10" font-weight="700" fill="#4AADA8">⊞  Layer Targeting</text>
  <text x="560" y="244" font-size="9" fill="#3a8a85">Which transformer layers receive the emotion signal</text>
  <!-- layer diagram -->
  <g>
    <rect x="560" y="253" width="90" height="40" rx="5" fill="#0e1e22" stroke="#4AADA8" stroke-width="1"/>
    <text x="605" y="268" text-anchor="middle" font-size="8.5" fill="#4AADA8">all layers</text>
    <text x="605" y="281" text-anchor="middle" font-size="7.5" fill="#3a8a85">Phi-4 optimal ✓</text>
    <rect x="662" y="253" width="90" height="40" rx="5" fill="#0a1810" stroke="#4AADA850" stroke-width="1"/>
    <text x="707" y="268" text-anchor="middle" font-size="8.5" fill="#4AADA880">first half</text>
    <text x="707" y="281" text-anchor="middle" font-size="7.5" fill="#3a7a7580">syntax layers</text>
    <rect x="762" y="253" width="90" height="40" rx="5" fill="#0e1e22" stroke="#4AADA8" stroke-width="1"/>
    <text x="807" y="268" text-anchor="middle" font-size="8.5" fill="#4AADA8">second half</text>
    <text x="807" y="281" text-anchor="middle" font-size="7.5" fill="#3a8a85">Qwen optimal ✓</text>
  </g>

  <!-- Models -->
  <rect x="535" y="319" width="325" height="110" rx="8" fill="#120814" stroke="#9B6FBF" stroke-width="1.2"/>
  <text x="560" y="339" font-size="10" font-weight="700" fill="#9B6FBF">⬡  Models &amp; Baselines</text>
  <text x="560" y="356" font-size="9" fill="#7a5a9f">Both run frozen under 4-bit NF4 quantisation</text>
  <rect x="550" y="364" width="100" height="44" rx="6" fill="#1a0e22" stroke="#9B6FBF" stroke-width="1"/>
  <text x="600" y="382" text-anchor="middle" font-size="9.5" font-weight="600" fill="#9B6FBF">Phi-4-mini</text>
  <text x="600" y="396" text-anchor="middle" font-size="8.5" fill="#7a5a9f">3.8B params</text>
  <rect x="660" y="364" width="90" height="44" rx="6" fill="#1a0e22" stroke="#9B6FBF" stroke-width="1"/>
  <text x="705" y="382" text-anchor="middle" font-size="9.5" font-weight="600" fill="#9B6FBF">Qwen 2.5</text>
  <text x="705" y="396" text-anchor="middle" font-size="8.5" fill="#7a5a9f">1.5B params</text>
  <rect x="760" y="364" width="90" height="44" rx="6" fill="#1a140e" stroke="#D4A843" stroke-width="1" stroke-dasharray="2,2"/>
  <text x="805" y="382" text-anchor="middle" font-size="9" font-weight="600" fill="#D4A843">LoRA PEFT</text>
  <text x="805" y="396" text-anchor="middle" font-size="8" fill="#a08030">Param Baseline</text>
  <text x="697" y="420" text-anchor="middle" font-size="8" fill="#6a4a8f">Optimals: Phi-4 (α=1.0, layers=all) · Qwen (α=1.5, layers=2nd half)</text>

  <!-- Metrics Panel -->
  <rect x="535" y="440" width="325" height="175" rx="8" fill="#0a1a10" stroke="#5BAD7A" stroke-width="1.2"/>
  <text x="560" y="460" font-size="10" font-weight="700" fill="#5BAD7A">◈  Key Metrics (Real-World, n=750)</text>
  <line x1="555" y1="467" x2="850" y2="467" stroke="#5BAD7A20" stroke-width="1"/>
  <!-- metric table header -->
  <text x="570" y="482" font-size="8.5" fill="#5BAD7A80">Scenario</text>
  <text x="680" y="482" font-size="8.5" fill="#5BAD7A80" text-anchor="middle">Target↑</text>
  <text x="745" y="482" font-size="8.5" fill="#5BAD7A80" text-anchor="middle">PPL↓(Median)</text>
  <text x="815" y="482" font-size="8.5" fill="#5BAD7A80" text-anchor="middle">JSD↑</text>
  
  <!-- phi4 rows -->
  <text x="570" y="498" font-size="8.5" fill="#c47a5a">Phi-4 Vanilla</text>
  <text x="680" y="498" font-size="8.5" fill="#a06050" text-anchor="middle">0.013</text>
  <text x="745" y="498" font-size="8.5" fill="#5BAD7A" text-anchor="middle">5.38</text>
  <text x="815" y="498" font-size="8.5" fill="#a06050" text-anchor="middle">—</text>
  
  <text x="570" y="512" font-size="8.5" fill="#c47a5a">Phi-4 Sys Prompt</text>
  <text x="680" y="512" font-size="8.5" fill="#5BAD7A" text-anchor="middle">0.314</text>
  <text x="745" y="512" font-size="8.5" fill="#c47a5a" text-anchor="middle">>1e11</text>
  <text x="815" y="512" font-size="8.5" fill="#5BAD7A" text-anchor="middle">0.513</text>

  <text x="570" y="526" font-size="8.5" fill="#D4A843">Phi-4 LoRA Baseline</text>
  <text x="680" y="526" font-size="8.5" fill="#5BAD7A" text-anchor="middle">0.332</text>
  <text x="745" y="526" font-size="8.5" fill="#c47a5a" text-anchor="middle">23.15</text>
  <text x="815" y="526" font-size="8.5" fill="#5BAD7A" text-anchor="middle">0.497</text>

  <text x="570" y="540" font-size="8.5" font-weight="700" fill="#D4A843">Phi-4 Steered (Ours)</text>
  <text x="680" y="540" font-size="8.5" fill="#D4A843" text-anchor="middle">0.014</text>
  <text x="745" y="540" font-size="8.5" fill="#D4A843" text-anchor="middle">8.37</text>
  <text x="815" y="540" font-size="8.5" fill="#D4A843" text-anchor="middle">0.432</text>

  <!-- qwen rows -->
  <text x="570" y="558" font-size="8.5" fill="#8a7abf">Qwen Vanilla</text>
  <text x="680" y="558" font-size="8.5" fill="#a06050" text-anchor="middle">0.009</text>
  <text x="745" y="558" font-size="8.5" fill="#5BAD7A" text-anchor="middle">7.26</text>
  <text x="815" y="558" font-size="8.5" fill="#a06050" text-anchor="middle">—</text>

  <text x="570" y="572" font-size="8.5" fill="#8a7abf">Qwen Sys Prompt</text>
  <text x="680" y="572" font-size="8.5" fill="#5BAD7A" text-anchor="middle">0.382</text>
  <text x="745" y="572" font-size="8.5" fill="#c47a5a" text-anchor="middle">12.85</text>
  <text x="815" y="572" font-size="8.5" fill="#5BAD7A" text-anchor="middle">0.514</text>

  <text x="570" y="586" font-size="8.5" fill="#D4A843">Qwen LoRA Baseline</text>
  <text x="680" y="586" font-size="8.5" fill="#a06050" text-anchor="middle">N/A</text>
  <text x="745" y="586" font-size="8.5" fill="#a06050" text-anchor="middle">N/A</text>
  <text x="815" y="586" font-size="8.5" fill="#a06050" text-anchor="middle">N/A</text>

  <text x="570" y="600" font-size="8.5" font-weight="700" fill="#D4A843">Qwen Steered (Ours)</text>
  <text x="680" y="600" font-size="8.5" fill="#D4A843" text-anchor="middle">0.010</text>
  <text x="745" y="600" font-size="8.5" fill="#D4A843" text-anchor="middle">14.71</text>
  <text x="815" y="600" font-size="8.5" fill="#D4A843" text-anchor="middle">0.374</text>

  <!-- Border glow -->
  <rect x="1" y="1" width="898" height="638" fill="none" stroke="#E8845A20" stroke-width="2" rx="16"/>
</svg>
